name: Compile Paper

# This project uses Quarto (paper/main.qmd), not LaTeX directly.
# Quarto compilation requires a full R + Python environment and is run locally.
# This workflow is intentionally a no-op — it exists only to avoid CI failures
# on push to paper/. Re-enable when a Quarto CI setup is added.

on:
  push:
    paths:
      - 'paper/**'
  pull_request:
    paths:
      - 'paper/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quarto project notice
        run: |
          echo "::notice::This project uses Quarto (paper/main.qmd). LaTeX CI is not configured."
          echo "::notice::Compile locally with: quarto render paper/main.qmd"
